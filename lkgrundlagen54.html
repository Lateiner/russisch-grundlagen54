<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernkartei: Russisch - Deutsch</title>
    <style>
        :root {
            --bg-color: #f1f8e9;
            --primary-green: #4caf50;
            --dark-green: #2e7d32;
            --light-green: #c8e6c9;
            --card-white: #ffffff;
            --text-color: #333;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--dark-green);
            margin: 0;
            font-size: 1.8rem;
        }

        .progress {
            margin-top: 10px;
            font-weight: bold;
            color: var(--dark-green);
            background: var(--light-green);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* Flashcard Container */
        .card-container {
            width: 100%;
            max-width: 500px;
            height: 300px;
            perspective: 1000px;
            cursor: pointer;
            margin: 20px auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: var(--shadow);
            border-radius: 15px;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-radius: 15px;
            background: var(--card-white);
            border: 4px solid var(--primary-green);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: var(--light-green);
        }

        .card-text {
            word-wrap: break-word;
            max-width: 100%;
            transition: font-size 0.2s;
        }

        .label {
            position: absolute;
            top: 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--dark-green);
            opacity: 0.7;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .nav-buttons {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-green);
            color: white;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: var(--dark-green);
        }

        button:active {
            transform: scale(0.95);
        }

        .secondary-btn {
            background-color: var(--dark-green);
        }

        .btn-prev, .btn-next {
            flex: 1;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .card-container {
                height: 250px;
            }
            .controls {
                gap: 10px;
            }
            button {
                padding: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Vokabeltrainer</h1>
        <div class="progress" id="progressText">1 / 1</div>
    </header>

    <div class="card-container" id="cardContainer">
        <div class="card-inner">
            <div class="card-face card-front">
                <span class="label">Russisch</span>
                <div class="card-text" id="frontText">Lädt...</div>
            </div>
            <div class="card-face card-back">
                <span class="label">Deutsch</span>
                <div class="card-text" id="backText">Lädt...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="nav-buttons">
            <button class="btn-prev" id="prevBtn">← Vorherige</button>
            <button class="btn-next" id="nextBtn">Nächste →</button>
        </div>
        <button class="secondary-btn" id="shuffleBtn">🔀 Mischen</button>
        <button class="secondary-btn" id="startBtn">🏠 Zum Anfang</button>
    </div>

    <script>
        // Vokabelliste
        const rawData = [
            ["а́втор", "Autor"],
            ["текст", "Text"],
            ["кни́га", "Buch"],
            ["письмо́", "Brief"],
            ["дом", "Haus"],
            ["окно́", "Fenster"],
            ["дверь", "Tür"],
            ["зада́ча", "Aufgabe"],
            ["пе́сня", "Lied"],
            ["уро́к", "Lektion / Unterricht"],
            ["пода́рок", "Geschenk"],
            ["оши́бка", "Fehler"],
            ["у́жин", "Abendessen"],
            ["рабо́та", "Arbeit"],
            ["статья́", "Artikel"],
            ["рабо́чий", "Arbeiter"],
            ["студе́нт", "Student"],
            ["певи́ца", "Sängerin"],
            ["поэ́т", "Poet"],
            ["оте́ц", "Vater"],
            ["учи́тель", "Lehrer"],
            ["инжене́р", "Ingenieur"],
            ["по́вар", "Koch / Köchin"],
            ["худо́жник", "Maler / Künstler"],
            ["карти́на", "Bild / Gemälde"],
            ["вид", "Aspekt"],
            ["соверше́нный вид", "vollendeter Aspekt"],
            ["несоверше́нный вид", "unvollendeter Aspekt"],
            ["прича́стие", "Partizip"],
            ["пасси́вный", "passiv"],
            ["акти́вный", "aktiv"],
            ["проше́дшее вре́мя", "Vergangenheit"],
            ["перехо́дный глаго́л", "transitives Verb"],
            ["твори́тельный паде́ж", "Instrumental (Fall 5)"],
            ["стро́ить / постро́ить", "bauen"],
            ["писа́ть / написа́ть", "schreiben"],
            ["реша́ть / реши́ть", "lösen, entscheiden"],
            ["чита́ть / прочита́ть", "lesen"],
            ["открыва́ть / откры́ть", "öffnen"],
            ["закрыва́ть / закры́ть", "schließen"],
            ["покупа́ть / купи́ть", "kaufen"],
            ["брать / взять", "nehmen"],
            ["забыва́ть / забы́ть", "vergessen"],
            ["ви́деть / уви́деть", "sehen, erblicken"],
            ["переводи́ть / перевести́", "übersetzen"],
            ["де́лать / сде́лать", "tun, machen"],
            ["получа́ть / получи́ть", "erhalten, bekommen"],
            ["исправля́ть / испра́вить", "korrigieren, verbessern"],
            ["теря́ть / потеря́ть", "verlieren"],
            ["се́ять / посе́ять", "säen"],
            ["убива́ть / уби́ть", "töten"],
            ["мыть / вы́мыть", "waschen"],
            ["петь / спеть", "singen"],
            ["расска́зывать / рассказа́ть", "erzählen"],
            ["гото́вить / пригото́вить", "zubereiten, kochen"],
            ["сажа́ть / посади́ть", "pflanzen, setzen"],
            ["осно́вывать / основа́ть", "gründen"],
            ["находи́ть / найти́", "finden"],
            ["возвраща́ть / возврати́ть", "zurückgeben"],
            ["приглаша́ть / пригласи́ть", "einladen"],
            ["освобождать / освободи́ть", "befreien"],
            ["восстана́вливать / восстанови́ть", "wiederherstellen"],
            ["публикова́ть / опубликова́ть", "veröffentlichen"],
            ["проверя́ть / прове́рить", "prüfen, kontrollieren"],
            ["учи́ть / вы́учить", "lernen, auswendig lernen"],
            ["разреза́ть / разре́зать", "schneiden, zerschneiden"],
            ["убира́ть / убра́ть", "aufräumen, wegmachen"],
            ["зака́зывать / заказа́ть", "bestellen"],
            ["выполня́ть / вы́полнить", "ausführen, erfüllen"],
            ["пра́вильный", "richtig / korrekt"],
            ["дли́нный", "lang"],
            ["интере́сный", "interessant"],
            ["тру́дный", "schwierig"],
            ["вчера́", "gestern"]
        ];

        let cards = rawData.map(item => ({ front: item[0], back: item[1] }));
        let currentIndex = 0;

        // Elemente
        const cardContainer = document.getElementById('cardContainer');
        const frontText = document.getElementById('frontText');
        const backText = document.getElementById('backText');
        const progressText = document.getElementById('progressText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const startBtn = document.getElementById('startBtn');

        // Initialisierung
        function updateUI() {
            const currentCard = cards[currentIndex];
            frontText.textContent = currentCard.front;
            backText.textContent = currentCard.back;
            progressText.textContent = `${currentIndex + 1} / ${cards.length}`;
            
            cardContainer.classList.remove('flipped');
            
            adjustFontSize(frontText);
            adjustFontSize(backText);
        }

        // Schriftgröße anpassen
        function adjustFontSize(element) {
            const text = element.textContent;
            if (text.length > 30) {
                element.style.fontSize = "1.2rem";
            } else if (text.length > 20) {
                element.style.fontSize = "1.5rem";
            } else {
                element.style.fontSize = "2rem";
            }
        }

        // Funktionen
        function flipCard() {
            cardContainer.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateUI();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        }

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            updateUI();
        }

        function goToStart() {
            currentIndex = 0;
            updateUI();
        }

        // Event Listener: Maus/Touch
        cardContainer.addEventListener('click', flipCard);
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevCard(); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextCard(); });
        shuffleBtn.addEventListener('click', shuffleCards);
        startBtn.addEventListener('click', goToStart);

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                case 'Enter':
                    e.preventDefault(); // Verhindert Scrollen bei Leertaste
                    flipCard();
                    break;
                case 'ArrowLeft':
                    prevCard();
                    break;
                case 'ArrowRight':
                    nextCard();
                    break;
                case 'Home':
                    goToStart();
                    break;
            }
        });

        // Start
        updateUI();
    </script>
</body>
</html>
