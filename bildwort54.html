<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild-Wort-Zuordnung: Russische Partizipien</title>
    <!-- Polyfill für Drag & Drop auf Touch-Geräten -->
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f0f3f6;
            --card-bg: #ffffff;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: var(--primary-color); font-size: 1.8rem; margin-bottom: 5px; }
        h2 { text-align: center; color: var(--secondary-color); font-weight: 300; font-size: 1.2rem; margin-bottom: 25px; }

        .intro-box {
            background-color: #f1f9ff;
            border-left: 6px solid var(--secondary-color);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        /* Wort-Pool */
        .drag-pool {
            background: #fff;
            border: 2px dashed var(--secondary-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .participle-tag {
            background: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: grab;
            user-select: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .participle-tag:active { cursor: grabbing; transform: scale(0.95); }
        .participle-tag.correct { background-color: var(--success-color) !important; }
        .participle-tag.incorrect { background-color: var(--error-color) !important; }

        /* Bilder-Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .image-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s;
        }

        .image-card:hover { transform: translateY(-5px); }

        .emoji-box {
            font-size: 4rem;
            margin-bottom: 10px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .noun-label {
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }

        .drop-zone {
            width: 100%;
            height: 45px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            transition: all 0.3s;
        }

        .drop-zone.active {
            background-color: #e3f2fd;
            border-color: var(--secondary-color);
        }

        /* Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button.action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-solution { background-color: var(--secondary-color); color: white; }

        @media (max-width: 500px) {
            .image-grid { grid-template-columns: 1fr; }
            .container { padding: 15px; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bild-Wort-Zuordnung</h1>
    <h2>Vokabular & Grammatik</h2>

    <div class="intro-box">
        <strong>Anleitung:</strong> Ziehe das passende Partizip auf das jeweilige Bild. Achte auf die Endung des Partizips, damit es zum Geschlecht und zur Anzahl des Objekts passt!
    </div>

    <!-- Pool der Partizipien -->
    <div class="drag-pool" id="pool">
        <!-- Inhalte werden per JS geladen -->
    </div>

    <!-- Grid der Bilder -->
    <div class="image-grid" id="grid">
        <!-- Inhalte werden per JS geladen -->
    </div>

    <div class="controls">
        <button class="action-btn btn-reset" onclick="resetAndShuffle()">Zurücksetzen und mischen</button>
        <button class="action-btn btn-solution" onclick="showAllSolutions()">Lösungen anzeigen</button>
    </div>
</div>

<script>
    const items = [
        { id: 1, emoji: "🪟🔓", noun: "окно (n)", participle: "открытое", hint: "geöffnet" },
        { id: 2, emoji: "🚪🔒", noun: "дверь (f)", participle: "закрытая", hint: "geschlossen" },
        { id: 3, emoji: "🏠🏗️", noun: "дом (m)", participle: "построенный", hint: "gebaut" },
        { id: 4, emoji: "📖✅", noun: "книги (pl)", participle: "прочитанные", hint: "gelesen" },
        { id: 5, emoji: "✉️✍️", noun: "письмо (n)", participle: "написанное", hint: "geschrieben" },
        { id: 6, emoji: "🎁💰", noun: "подарок (m)", participle: "купленный", hint: "gekauft" },
        { id: 7, emoji: "🌳🌱", noun: "дерево (n)", participle: "посаженное", hint: "gepflanzt" },
        { id: 8, emoji: "🍲👩‍🍳", noun: "ужин (m)", participle: "приготовленный", hint: "zubereitet" },
        { id: 9, emoji: "🧹🏠", noun: "комната (f)", participle: "убранная", hint: "aufgeräumt" },
        { id: 10, emoji: "☕📉", noun: "кофе (m)", participle: "выпитый", hint: "getrunken" },
        { id: 11, emoji: "🍎🔪", noun: "яблоко (n)", participle: "разрезанное", hint: "geschnitten" },
        { id: 12, emoji: "🖼️🎨", noun: "картина (f)", participle: "нарисованная", hint: "gemalt" }
    ];

    const pool = document.getElementById('pool');
    const grid = document.getElementById('grid');

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function init() {
        pool.innerHTML = '';
        grid.innerHTML = '';

        // Partizipien für den Pool mischen
        const shuffledParticiples = shuffle(items.map(item => ({ id: item.id, text: item.participle })));
        shuffledParticiples.forEach(p => {
            const tag = document.createElement('div');
            tag.className = 'participle-tag';
            tag.draggable = true;
            tag.id = `part-${p.id}`;
            tag.textContent = p.text;
            tag.dataset.id = p.id;
            tag.addEventListener('dragstart', handleDragStart);
            pool.appendChild(tag);
        });

        // Bilder-Grid mischen
        const shuffledItems = shuffle([...items]);
        shuffledItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `
                <div class="emoji-box">${item.emoji}</div>
                <div class="noun-label">${item.noun}</div>
                <div class="drop-zone" data-id="${item.id}" id="zone-${item.id}"></div>
                <div style="font-size: 0.75rem; color: #999; margin-top: 5px;">(${item.hint})</div>
            `;
            const zone = card.querySelector('.drop-zone');
            zone.addEventListener('dragover', handleDragOver);
            zone.addEventListener('dragleave', handleDragLeave);
            zone.addEventListener('drop', handleDrop);
            grid.appendChild(card);
        });
    }

    function handleDragStart(e) {
        e.dataTransfer.setData('text/plain', e.target.id);
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('active');
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('active');
    }

    function handleDrop(e) {
        e.preventDefault();
        const zone = e.currentTarget;
        zone.classList.remove('active');
        
        const cardId = e.dataTransfer.getData('text/plain');
        const tag = document.getElementById(cardId);
        
        const zoneId = zone.dataset.id;
        const tagIdRef = tag.dataset.id;

        // Feedback
        if (zoneId === tagIdRef) {
            tag.className = 'participle-tag correct';
        } else {
            tag.className = 'participle-tag incorrect';
        }

        // Falls schon ein Wort in der Zone ist, zurück in den Pool
        if (zone.children.length > 0) {
            const oldTag = zone.children[0];
            oldTag.className = 'participle-tag';
            pool.appendChild(oldTag);
        }

        zone.appendChild(tag);
    }

    // Ermöglicht das Zurücklegen in den Pool
    pool.addEventListener('dragover', e => e.preventDefault());
    pool.addEventListener('drop', e => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const tag = document.getElementById(id);
        tag.className = 'participle-tag';
        pool.appendChild(tag);
    });

    function resetAndShuffle() {
        init();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAllSolutions() {
        items.forEach(item => {
            const zone = document.getElementById(`zone-${item.id}`);
            const tag = document.getElementById(`part-${item.id}`);
            
            tag.className = 'participle-tag correct';
            zone.innerHTML = '';
            zone.appendChild(tag);
        });
    }

    window.onload = init;
</script>

</body>
</html>
